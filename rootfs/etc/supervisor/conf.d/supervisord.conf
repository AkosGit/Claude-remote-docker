; Supervises the three long-lived session services.
;
; Both run as %(ENV_SESSION_USER)s -- root by default. HOME stays /home/claude
; either way, because that is the persisted volume: run as root and your Claude
; Desktop login, browser profiles and TLS cert still survive a restart.
;
; Everything in the session shares one uid on purpose. Mixing (session as
; claude, one app as root) leaves root-owned files in /home/claude and breaks
; the next non-root launch with an error that looks unrelated to the cause.
;
; Chromium and Claude Desktop are deliberately NOT listed here -- they are
; launched by XFCE autostart so they inherit the session D-Bus that
; start-xfce.sh creates. See start-xfce.sh for the rationale.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:kasmvnc]
command=/usr/local/bin/start-vnc.sh
user=%(ENV_SESSION_USER)s
directory=/home/claude
environment=HOME="/home/claude",USER="%(ENV_SESSION_USER)s",SHELL="/bin/bash"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=%(ENV_SESSION_USER)s
directory=/home/claude
environment=HOME="/home/claude",USER="%(ENV_SESSION_USER)s",SHELL="/bin/bash",DISPLAY=":1"
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
; Re-exports the SAME :1 display over raw RFB for native VNC clients. Not a
; second X server, so no second desktop and no lock collisions.
command=/usr/local/bin/start-x11vnc.sh
user=%(ENV_SESSION_USER)s
directory=/home/claude
environment=HOME="/home/claude",USER="%(ENV_SESSION_USER)s",DISPLAY=":1"
autorestart=true
priority=40
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
