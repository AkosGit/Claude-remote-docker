; Supervises the two long-lived session services.
;
; Chromium and Claude Desktop are deliberately NOT listed here -- they are
; launched by XFCE autostart so they inherit the session D-Bus that
; start-xfce.sh creates. See start-xfce.sh for the rationale.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:kasmvnc]
command=/usr/local/bin/start-vnc.sh
user=claude
directory=/home/claude
environment=HOME="/home/claude",USER="claude",SHELL="/bin/bash"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=claude
directory=/home/claude
environment=HOME="/home/claude",USER="claude",SHELL="/bin/bash",DISPLAY=":1"
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
