# Local resource ceilings. Without these the container is unbounded and can
# starve a 6.4GB host into a whole-machine I/O stall.
services:
  claude-desktop:
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2.0
    # Must fit inside mem_limit: /dev/shm is tmpfs and counts as RAM.
    # Sized to actually hold Chromium's shared buffers, since the image no
    # longer passes --disable-dev-shm-usage -- that flag pushed them to /tmp,
    # which is the container overlay, i.e. disk.
    shm_size: 512m
