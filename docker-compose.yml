services:
  claude-desktop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bump to pick up upstream fixes after Anthropic changes the
        # Claude Desktop installer format.
        CLAUDE_DEB_REF: main
    image: claude-vnc-desktop:latest
    container_name: claude-vnc-desktop
    # Stable hostname: Chromium writes the hostname into the profile's
    # SingletonLock. A fresh random hostname each recreate would make every
    # leftover lock look like it belongs to a live browser elsewhere.
    hostname: claude-vnc-desktop

    env_file:
      - .env

    ports:
      # KasmVNC web desktop, HTTPS by default (VNC_TLS=1).
      #
      # BIND_ADDR defaults to 127.0.0.1 so a careless `up` never exposes the
      # desktop to the network. For a remote deployment set BIND_ADDR=0.0.0.0
      # in .env -- but only with VNC_TLS=1, since plain HTTP over a network
      # both leaks the session and silently disables the clipboard.
      - "${BIND_ADDR:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
      # Native VNC (x0vncserver) onto the same desktop. Classic VNC auth is weak --
      # no username, 8-character password ceiling -- so this stays on
      # BIND_ADDR, i.e. loopback unless you deliberately change it. Reach it
      # remotely over an SSH tunnel or Tailscale, not by opening the port.
      - "${BIND_ADDR:-127.0.0.1}:${X11VNC_PORT:-5901}:5901"

    volumes:
      # Single home volume: Claude Desktop login, both browser profiles and
      # their extensions, Claude Code auth, shell history -- everything.
      # Reset the whole environment with: docker compose down -v
      - claude-home:/home/claude
      # Your code. Edit on the host, run it in the container.
      - ./workspace:/workspace

    # Chromium and Electron crash on Docker's default 64MB /dev/shm, which is
    # where their renderers exchange rendered frames with the browser process.
    #
    # This is deliberately real memory rather than --disable-dev-shm-usage:
    # that flag does not save memory, it redirects the same traffic to /tmp,
    # and /tmp here is the container overlay -- i.e. disk. Keeping it in RAM
    # trades a little memory for markedly less I/O.
    #
    # tmpfs counts against mem_limit, so this must stay well under it.
    shm_size: "512m"

    # Resource ceilings. Docker runs containers unbounded by default, and on a
    # small host that matters: this was the largest consumer on a 6.4GB machine
    # and coincided with whole-machine I/O stalls. Sized for roughly 6-8GB of
    # RAM; raise on a larger host.
    #
    # To change these for one machine without editing this file, create an
    # untracked docker-compose.override.yml -- compose merges it automatically.
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2.0

    # Reaping zombie processes; tini handles PID 1 duties inside.
    init: false

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  claude-home:
